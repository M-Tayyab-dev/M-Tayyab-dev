<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="110" viewBox="0 0 1000 110" role="img" aria-labelledby="footerTitle">
  <title id="footerTitle">Thank you for visiting</title>
  <defs>
    <linearGradient id="footerWine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#451126"/>
      <stop offset=".5" stop-color="#C77B9B"/>
      <stop offset="1" stop-color="#451126"/>
      <animate attributeName="x1" values="0;1;0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <path d="M20 55 H980" stroke="#451126" stroke-width="1"/>
  <path d="M20 55 H980" stroke="url(#footerWine)" stroke-width="2" stroke-dasharray="180 820">
    <animate attributeName="stroke-dashoffset" values="1000;0" dur="8s" repeatCount="indefinite"/>
  </path>
  <circle cx="500" cy="55" r="20" fill="#190B12" stroke="#C77B9B" stroke-opacity=".7"/>
  <path d="M490 60 L500 47 L510 60 M500 47 V65" fill="none" stroke="#E5B5C7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="500" y="94" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" letter-spacing="3" fill="#C77B9B">THANK YOU FOR STOPPING BY</text>
</svg>