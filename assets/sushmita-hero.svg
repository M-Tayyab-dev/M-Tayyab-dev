<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Muhammad Tayyab — Developer Profile</title>
  <desc id="desc">A cinematic burgundy developer banner with subtle animated gradients, a technical grid, orbit geometry, and a glowing underline.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10070C"/>
      <stop offset=".55" stop-color="#190B12"/>
      <stop offset="1" stop-color="#451126"/>
    </linearGradient>
    <linearGradient id="wine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#701A3D"/>
      <stop offset=".5" stop-color="#C77B9B"/>
      <stop offset="1" stop-color="#701A3D"/>
      <animate attributeName="x1" values="0;1;0" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;0;1" dur="10s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#C77B9B" stop-opacity=".25"/>
      <stop offset="1" stop-color="#C77B9B" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#E5B5C7" stroke-opacity=".075" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-40%" y="-300%" width="180%" height="700%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <mask id="fade">
      <linearGradient id="fadeGradient" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="white"/>
        <stop offset="1" stop-color="#777"/>
      </linearGradient>
      <rect width="1200" height="420" fill="url(#fadeGradient)"/>
    </mask>
  </defs>
  <rect width="1200" height="420" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="20" fill="url(#grid)"/>
  <circle cx="990" cy="115" r="260" fill="url(#glow)">
    <animate attributeName="r" values="230;280;230" dur="8s" repeatCount="indefinite"/>
  </circle>
  <g fill="none" stroke="#C77B9B" stroke-opacity=".42">
    <ellipse cx="970" cy="210" rx="165" ry="72" transform="rotate(-28 970 210)"/>
    <ellipse cx="970" cy="210" rx="165" ry="72" transform="rotate(42 970 210)" stroke-opacity=".22"/>
    <circle cx="970" cy="210" r="112" stroke-dasharray="2 10" stroke-opacity=".35"/>
    <circle cx="1084" cy="132" r="5" fill="#E5B5C7" stroke="none">
      <animate attributeName="opacity" values=".45;1;.45" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="866" cy="270" r="4" fill="#C77B9B" stroke="none"/>
  </g>
  <path d="M690 65 C760 120 720 180 800 215 S920 270 1120 340" fill="none" stroke="url(#wine)" stroke-width="1.5" stroke-opacity=".65" mask="url(#fade)">
    <animate attributeName="stroke-dasharray" values="0 700;360 700;700 700" dur="7s" repeatCount="indefinite"/>
  </path>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="78" y="94" font-size="13" letter-spacing="4" fill="#C77B9B">DEVELOPER / CREATIVE TECHNOLOGIST</text>
    <text x="74" y="184" font-size="61" font-weight="700" letter-spacing="-2" fill="#F8F0F3">Muhammad Tayyab</text>
    <text x="78" y="229" font-size="20" fill="#E5B5C7">WordPress Developer  ·  Full-Stack Developer</text>
    <text x="78" y="260" font-size="20" fill="#E5B5C7">Creative Technologist  ·  QA Specialist</text>
    <path d="M78 294 H520" stroke="#451126" stroke-width="5" stroke-linecap="round"/>
    <path d="M78 294 H520" stroke="url(#wine)" stroke-width="3" stroke-linecap="round" filter="url(#softGlow)">
      <animate attributeName="stroke-dasharray" values="0 442;442 442;0 442" dur="5s" repeatCount="indefinite"/>
    </path>
    <text x="78" y="344" font-size="12" letter-spacing="3" fill="#C77B9B">BUILD WITH INTENT. TEST WITH CARE.</text>
    <text x="1115" y="385" font-size="10" letter-spacing="2" text-anchor="end" fill="#E5B5C7" opacity=".7">MT / 2026</text>
  </g>
  <rect x=".5" y=".5" width="1199" height="419" rx="20" fill="none" stroke="#C77B9B" stroke-opacity=".28"/>
</svg>